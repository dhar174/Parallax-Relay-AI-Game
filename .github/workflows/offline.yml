name: Offline verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11', dependencies: locked}
          - {os: ubuntu-24.04, python: '3.12', dependencies: locked}
          - {os: ubuntu-24.04, python: '3.13', dependencies: locked}
          - {os: windows-2022, python: '3.12', dependencies: locked}
          - {os: macos-15, python: '3.12', dependencies: locked}
          - {os: ubuntu-24.04, python: '3.12', dependencies: ranges}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python }}
          cache: ${{ matrix.dependencies == 'locked' && 'pip' || '' }}
          cache-dependency-path: |
            requirements-dev.lock
            requirements-bootstrap.lock
            requirements.txt
      - name: Create isolated environment and pin pip
        id: bootstrap
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import venv
          root = Path(tempfile.mkdtemp(prefix='parallax-venv-', dir=os.environ['RUNNER_TEMP']))
          venv.create(root, with_pip=False)
          scripts = root / ('Scripts' if os.name == 'nt' else 'bin')
          python = scripts / ('python.exe' if os.name == 'nt' else 'python')
          subprocess.run([sys.executable, '-m', 'pip', '--python', str(python), 'install',
                          '--require-hashes', '--only-binary=:all:', '-r', 'requirements-bootstrap.lock'], check=True)
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as handle:
              handle.write(str(scripts) + '\n')
      - name: Install locked dependencies
        if: matrix.dependencies == 'locked'
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-dev.lock -r requirements.txt
      - name: Resolve compatibility ranges afresh
        if: matrix.dependencies == 'ranges'
        run: >-
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Report verification environment
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        shell: python
        run: |
          import platform
          import subprocess
          import sys
          print(f'Python {sys.version}; OS {platform.platform()}; architecture {platform.machine()}', flush=True)
          print(f'Verification environment: {sys.prefix}', flush=True)
          subprocess.run([sys.executable, '-m', 'pip', '--version'], check=True)
          subprocess.run([sys.executable, '-m', 'pip', 'list', '--format=freeze'], check=True)
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run complete offline unittest suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q parallax_relay tests scripts site
      - name: Check normal and fast mock outcomes
        run: python scripts/check_mock_runs.py
      - name: Verify curated room solvability certificates
        run: python scripts/check_rooms.py
      - name: Set up Node for workbench regression tests
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' && matrix.dependencies == 'locked'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check workbench JavaScript and import flows
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' && matrix.dependencies == 'locked'
        run: |
          python site/build_workbench.py
          node --check site/web/app.js
          node --check site/web/contracts.mjs
          node --test --test-concurrency=1 tests/test_workbench_web.mjs
      - name: Check diff whitespace
        run: python scripts/check_committed_diff.py
      - name: Check working-tree whitespace
        run: git diff --check

  browser:
    name: Chromium / Ubuntu 24 / Python 3.12 / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - name: Install locked Python environment
        run: |
          python -m venv .venv
          python -m pip --python .venv/bin/python install --require-hashes --only-binary=:all: -r requirements-bootstrap.lock
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock -r requirements.txt
          .venv/bin/python -m pip check
      - name: Install locked browser development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/browser
      - name: Provision the matching managed Chromium and OS libraries
        working-directory: tools/browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Run reproducible offline browser coverage
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: npm test --prefix tools/browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: chromium-browser-evidence
          path: tools/browser/test-results/
          if-no-files-found: ignore
