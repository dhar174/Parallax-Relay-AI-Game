name: Offline verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.11', dependencies: locked}
          - {os: ubuntu-24.04, python: '3.12', dependencies: locked}
          - {os: ubuntu-24.04, python: '3.13', dependencies: locked}
          - {os: windows-2022, python: '3.12', dependencies: locked}
          - {os: macos-15, python: '3.12', dependencies: locked}
          - {os: ubuntu-24.04, python: '3.12', dependencies: ranges}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements.txt
      - name: Pin pip bootstrap
        run: python -m pip install pip==26.3
      - name: Install locked dependencies
        if: matrix.dependencies == 'locked'
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r requirements-dev.lock -r requirements.txt
      - name: Resolve compatibility ranges afresh
        if: matrix.dependencies == 'ranges'
        run: >-
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Report verification environment
        if: always() && steps.python.outcome == 'success'
        shell: python
        run: |
          import platform
          import subprocess
          import sys
          print(f'Python {sys.version}; OS {platform.platform()}; architecture {platform.machine()}', flush=True)
          subprocess.run([sys.executable, '-m', 'pip', '--version'], check=True)
          subprocess.run([sys.executable, '-m', 'pip', 'list', '--format=freeze'], check=True)
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run complete offline unittest suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q parallax_relay tests scripts
      - name: Check normal and fast mock outcomes
        run: python scripts/check_mock_runs.py
      - name: Check diff whitespace
        run: git diff --check
