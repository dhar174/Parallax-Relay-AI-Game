# Choose image-capable, structured-output models available to your accounts.
# Providers are not tied to roles; swap these assignments for experiments.
[match]
communication_rounds = 2
max_turns = 12
max_calls = 216
max_attempts = 2
max_output_tokens = 2048
timeout_seconds = 60
history_turns = 4
retry_delay_seconds = 0.5
max_consecutive_failures = 3
image_token_reserve = 8192
# Optional LOCAL ESTIMATE, not a provider billing guarantee:
# max_estimated_cost_usd = 2.0
# Requires explicit pricing tables for ALL three players below.

[players.SPECTRA]
provider = "openai"
model_env = "OPENAI_MODEL"
api_key_env = "OPENAI_API_KEY"

[players.PYRA]
provider = "anthropic"
model_env = "ANTHROPIC_MODEL"
api_key_env = "ANTHROPIC_API_KEY"

[players.FLUX]
provider = "gemini"
model_env = "GEMINI_MODEL"
api_key_env = "GEMINI_API_KEY"

# Pricing values below are examples of CONFIGURATION SHAPE, not quoted prices.
# [players.SPECTRA.pricing]
# input_per_million = <current input price for your selected model>
# output_per_million = <current output price, including reasoning where billed>
# Repeat for PYRA and FLUX before enabling max_estimated_cost_usd.
